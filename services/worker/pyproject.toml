[project]
name = "rightjob-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rightjob-core",
    "temporalio==1.30.0",
]

[tool.uv.sources]
rightjob-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightjob_worker"]

