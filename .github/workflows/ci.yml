name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Install locked dependencies
        run: make install

      - name: Validate foundation
        run: make ci
