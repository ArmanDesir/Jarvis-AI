[project]
name = "rightjob-core"
version = "0.1.0"
description = "Vendor-neutral core contracts and bootstrap utilities for Rightjob AI OS"
requires-python = ">=3.11"
dependencies = [
  "pyjwt>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightjob"]
